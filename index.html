<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معلومات عامة</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      text-align: center;
      padding: 20px;
    }
    .box {
      background: white;
      max-width: 500px;
      margin: 30px auto;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 12px #ccc;
    }
    button {
      background: #087f8c;
      color: white;
      border: none;
      padding: 12px 20px;
      margin: 8px;
      border-radius: 8px;
      font-size: 17px;
    }
    h1 { color: #087f8c; }
  </style>
</head>
<body>
  <div class="box">
    <h1>اختبر معلوماتك العامة</h1>
    <p id="question">ما عاصمة مصر؟</p>
    <div id="answers">
      <button onclick="check('القاهرة')">القاهرة</button>
      <button onclick="check('الإسكندرية')">الإسكندرية</button>
      <button onclick="check('الأقصر')">الأقصر</button>
    </div>
    <p id="result"></p>
    <button onclick="nextQuestion()">السؤال التالي</button>
    <p id="score">النقاط: 0</p>
  </div>
  <script>
    const questions = [
      {q:"ما عاصمة مصر؟", a:["القاهرة","الإسكندرية","الأقصر"], c:"القاهرة"},
      {q:"كم عدد أيام الأسبوع؟", a:["خمسة","سبعة","عشرة"], c:"سبعة"},
      {q:"ما الكوكب المعروف بالكوكب الأحمر؟", a:["الزهرة","المريخ","زحل"], c:"المريخ"},
      {q:"كم ضلعًا للمثلث؟", a:["ثلاثة","أربعة","خمسة"], c:"ثلاثة"},
      {q:"ما أكبر محيط في العالم؟", a:["الأطلسي","الهندي","الهادئ"], c:"الهادئ"}
    ];
    let current = 0, score = 0, answered = false;
    function showQuestion() {
      answered = false;
      document.getElementById("question").textContent = questions[current].q;
      document.getElementById("result").textContent = "";
      document.getElementById("answers").innerHTML = "";
      questions[current].a.forEach(x => {
        const b = document.createElement("button");
        b.textContent = x;
        b.onclick = () => check(x);
        document.getElementById("answers").appendChild(b);
      });
      document.getElementById("score").textContent = "النقاط: " + score;
    }
    function check(answer) {
      if (answered) return;
      answered = true;
      if (answer === questions[current].c) {
        score++;
        document.getElementById("result").textContent = "إجابة صحيحة! أحسنت 🎉";
      } else {
        document.getElementById("result").textContent = "إجابة خطأ. الصحيح: " + questions[current].c;
      }
      document.getElementById("score").textContent = "النقاط: " + score;
    }
    function nextQuestion() {
      current = (current + 1) % questions.length;
      showQuestion();
    }
    showQuestion();
  </script>
</body>
</html>
